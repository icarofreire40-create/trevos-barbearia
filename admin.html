<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel — Trevos Barbearia</title>
<link rel="icon" href="img/logo.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- Tela de login -->
<div class="login-wrap" id="login-wrap">
  <div class="login-card">
    <img src="img/logo.png" alt="Trevos Barbearia" class="logo" style="width:84px; height:84px;">
    <h1 class="brand-name">Painel</h1>
    <p class="brand-tagline" style="margin-top:2px;">Trevos Barbearia</p>
    <form id="login-form">
      <input type="text" id="login-email" placeholder="E-mail" autocomplete="username" required>
      <input type="password" id="login-senha" placeholder="Senha" autocomplete="current-password" required>
      <p class="login-error" id="login-error"></p>
      <button type="submit" class="btn btn-primary" style="width:100%;">Entrar</button>
    </form>
  </div>
</div>

<!-- Painel administrativo -->
<div class="admin-shell" id="admin-shell">
  <div class="container">
    <div class="admin-header">
      <h1 class="brand-name">Trevos · Painel</h1>
      <span class="logout-link" id="logout-link">Sair</span>
    </div>

    <div class="admin-filters">
      <select id="filtro-barbeiro">
        <option value="todos">Todos os barbeiros</option>
      </select>
      <input type="date" id="filtro-data">
    </div>

    <div class="appt-list" id="appt-list">
      <p class="admin-empty">Carregando agendamentos...</p>
    </div>
  </div>
</div>

<script type="module" src="js/admin.js"></script>
</body>
</html>
